<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>LUMINA</title>
    <!--
      Os mesmos tokens do aplicativo, gerados por scripts/design/generate_tokens.py.
      Antes esta tela tinha paleta e tipografia próprias (Segoe UI fixa, cores soltas):
      era a PRIMEIRA coisa que o usuário via e não se parecia com o produto.

      O splash segue o tema do sistema, e não a preferência salva: ele roda antes do
      React, num contexto que não alcança o localStorage do aplicativo. Os tokens já
      trazem a media query de prefers-color-scheme, então isso sai de graça.
    -->
    <link rel="stylesheet" href="./wizard/tokens.css" />
    <style>
      @layer lm.wizard {
        html,
        body {
          block-size: 100%;
        }

        body {
          margin: 0;
          display: grid;
          place-items: center;
          background-color: var(--lm-color-background);
          color: var(--lm-color-on-surface);
          font-family: var(--lm-font-sans);
          user-select: none;
          overflow: hidden;
        }

        .splash {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--lm-space-32);
          inline-size: min(320px, 80vw);
          text-align: center;
        }

        .splash__marca {
          color: var(--lm-color-primary);
          font-size: var(--lm-type-headline-md-size);
          line-height: var(--lm-type-headline-md-line);
          font-weight: var(--lm-type-title-md-weight);
          letter-spacing: 0.2em;
          margin: 0;
        }

        .splash__apoio {
          margin: var(--lm-space-8) 0 0;
          color: var(--lm-color-on-surface-variant);
          font-size: var(--lm-type-body-sm-size);
          line-height: var(--lm-type-body-sm-line);
          letter-spacing: var(--lm-type-body-sm-tracking);
        }

        .splash__estado {
          inline-size: 100%;
        }

        /* Barra determinada: o processo principal escreve a largura em %.
           Uma barra que anda diz "está acontecendo"; um giro infinito não diz
           quanto falta, e a inicialização do backend pode levar segundos. */
        .splash__trilha {
          inline-size: 100%;
          block-size: var(--lm-progress-track-height);
          border-radius: var(--lm-radius-full);
          background-color: var(--lm-progress-track);
          overflow: hidden;
        }

        .splash__barra {
          inline-size: 0%;
          block-size: 100%;
          border-radius: inherit;
          background-color: var(--lm-progress-indicator);
          transition: inline-size var(--lm-duration-emphasized) var(--lm-easing-standard);
        }

        .splash__texto {
          margin: var(--lm-space-12) 0 0;
          color: var(--lm-color-on-surface-variant);
          font-size: var(--lm-type-body-sm-size);
          line-height: var(--lm-type-body-sm-line);
          letter-spacing: var(--lm-type-body-sm-tracking);
          /* Altura reservada: sem isto o bloco pula de altura a cada mensagem
             nova e a barra de progresso balança junto. */
          min-block-size: var(--lm-type-body-sm-line);
        }

        .splash__versao {
          position: fixed;
          inset-block-end: var(--lm-space-16);
          color: var(--lm-color-on-surface-disabled);
          font-size: var(--lm-type-label-sm-size);
          letter-spacing: var(--lm-type-label-sm-tracking);
          font-variant-numeric: tabular-nums;
        }

        @media (prefers-reduced-motion: reduce) {
          .splash__barra {
            transition-duration: 1ms;
          }
        }
      }
    </style>
  </head>
  <body>
    <!-- `role="status"` com aria-live: o leitor de tela anuncia cada etapa da
         inicialização em vez de deixar o usuário diante de uma tela muda. -->
    <div class="splash" role="status" aria-live="polite">
      <div>
        <h1 class="splash__marca">LUMINA</h1>
        <p class="splash__apoio">Gestão de apartamento</p>
      </div>

      <div class="splash__estado">
        <div class="splash__trilha">
          <div class="splash__barra" id="progressBar"></div>
        </div>
        <p class="splash__texto" id="statusText">Iniciando…</p>
      </div>
    </div>

    <span class="splash__versao" id="appVersion"></span>
  </body>
</html>
